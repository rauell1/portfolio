name: Safe Rollback

# This workflow has two completely independent trigger paths:
#
# PATH A — push to main:
#   build job runs → on success, tag-snapshot job runs
#   These are chained with needs: [build] intentionally.
#
# PATH B — manual dispatch:
#   tag-snapshot-manual job runs (no build dependency)
#   rollback job runs if target_sha is provided
#
# Separating the two paths avoids the needs.build.result == 'skipped'
# problem that caused the previous version to silently do nothing on
# manual dispatches.

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'SHA to roll back to (leave empty to just tag HEAD)'
        required: false
        default: ''
      reason:
        description: 'Reason for rollback'
        required: false
        default: 'Manual rollback via GitHub Actions'

permissions:
  contents: write

jobs:
  # ── PATH A, step 1: build gate (push only) ──────────────────────
  build:
    name: Build & lint gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

  # ── PATH A, step 2: tag on successful push build ─────────────────
  tag-on-push:
    name: Tag snapshot (post-push)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create snapshot tags
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short HEAD)
          FULL=$(git rev-parse HEAD)
          TS=$(date -u +"%Y%m%dT%H%M%SZ")
          TAG="snapshot/${TS}-${SHORT}"
          git tag "$TAG" "$FULL" -m "Auto-snapshot: push build passed"
          git tag -f snapshot/latest "$FULL" -m "Latest known-good: $FULL"
          git push origin "$TAG"
          git push origin snapshot/latest --force
          echo "Tagged: $TAG"
          echo "## Snapshot created" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${SHORT}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| snapshot/latest | updated |" >> $GITHUB_STEP_SUMMARY

  # ── PATH B, step 1: tag on manual dispatch (no build needed) ─────
  tag-on-dispatch:
    name: Tag snapshot (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create snapshot tags
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short HEAD)
          FULL=$(git rev-parse HEAD)
          TS=$(date -u +"%Y%m%dT%H%M%SZ")
          TAG="snapshot/${TS}-${SHORT}"
          git tag "$TAG" "$FULL" -m "Manual snapshot dispatch"
          git tag -f snapshot/latest "$FULL" -m "Latest known-good: $FULL"
          git push origin "$TAG"
          git push origin snapshot/latest --force
          echo "Tagged: $TAG"

  # ── PATH B, step 2: rollback (manual + target_sha provided) ──────
  rollback:
    name: Non-destructive rollback
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_sha != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Validate target SHA
        id: val
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target_sha }}"
          FULL=$(git rev-parse "${TARGET}" 2>/dev/null) || {
            echo "::error::SHA '${TARGET}' not found."
            exit 1
          }
          SHORT=$(git rev-parse --short "$FULL")
          echo "full=$FULL"   >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
      - name: Perform revert
        run: |
          set -euo pipefail
          FULL="${{ steps.val.outputs.full }}"
          SHORT="${{ steps.val.outputs.short }}"
          CURRENT=$(git rev-parse HEAD)
          if [ "$CURRENT" = "$FULL" ]; then
            echo "::warning::Already at target SHA — nothing to revert."
            exit 0
          fi
          COMMITS=$(git log --reverse --pretty=format:"%H" "${FULL}"..HEAD)
          if [ -z "$COMMITS" ]; then
            echo "No commits to revert."
            exit 0
          fi
          while IFS= read -r c; do
            git revert --no-edit --no-commit "$c" || {
              git revert --abort 2>/dev/null || true
              echo "::error::Conflict at $c — rollback aborted."
              exit 1
            }
          done <<< "$COMMITS"
          REASON="${{ github.event.inputs.reason }}"
          ACTOR="${{ github.actor }}"
          COMMIT_MSG=$(printf 'revert(rollback): restore state at %s\n\nTarget: %s (%s)\nReason: %s\nBy: %s\n\nNon-destructive - all history preserved.' "$SHORT" "$SHORT" "$FULL" "$REASON" "$ACTOR")
          git commit -m "$COMMIT_MSG"
          git pull --rebase origin main
          git push origin main
          echo "Rollback pushed."
          echo "## Rollback complete" >> $GITHUB_STEP_SUMMARY
          echo "| Rolled back to | \`${SHORT}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ github.event.inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
