# ============================================================
# AUTO README UPDATER
# Triggers on every push to main (excluding README.md self-commits).
# Gathers live repo stats, writes them to a temp file, then splices
# the block between <!-- AUTO-UPDATED:START --> and <!-- AUTO-UPDATED:END -->
# using pure awk — no Python, no heredoc variable-expansion issues.
# Commits only when the file actually changed.
# ============================================================
name: Auto README Updater

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'   # prevent infinite loop on bot self-commits
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Regenerate dynamic README sections
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js (for package.json reads)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gather repo stats
        id: stats
        run: |
          echo "sha=$(git rev-parse --short HEAD)"                                           >> $GITHUB_OUTPUT
          echo "msg=$(git log -1 --pretty=format:'%s')"                                      >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --pretty=format:'%cd' --date=format:'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=format:'%an')"                                  >> $GITHUB_OUTPUT
          echo "total=$(git rev-list --count HEAD)"                                          >> $GITHUB_OUTPUT
          echo "branch=$(git rev-parse --abbrev-ref HEAD)"                                   >> $GITHUB_OUTPUT

          TS=$(find src -name '*.ts' -o -name '*.tsx' 2>/dev/null | wc -l | tr -d ' ')
          CSS=$(find src -name '*.css' 2>/dev/null | wc -l | tr -d ' ')
          COMP=$(find src/components -name '*.tsx' 2>/dev/null | wc -l | tr -d ' ')
          PAGES=$(find src/pages src/views src/app -name '*.tsx' 2>/dev/null | wc -l | tr -d ' ')
          VER=$(node -p "require('./package.json').version" 2>/dev/null || echo 'n/a')
          ENG=$(node -p "require('./package.json').engines?.node || 'n/a'" 2>/dev/null || echo 'n/a')

          echo "ts=${TS}"       >> $GITHUB_OUTPUT
          echo "css=${CSS}"     >> $GITHUB_OUTPUT
          echo "comp=${COMP}"   >> $GITHUB_OUTPUT
          echo "pages=${PAGES}" >> $GITHUB_OUTPUT
          echo "ver=${VER}"     >> $GITHUB_OUTPUT
          echo "eng=${ENG}"     >> $GITHUB_OUTPUT

      - name: Write replacement block to temp file
        env:
          SHA:    ${{ steps.stats.outputs.sha }}
          MSG:    ${{ steps.stats.outputs.msg }}
          DATE:   ${{ steps.stats.outputs.date }}
          AUTHOR: ${{ steps.stats.outputs.author }}
          TOTAL:  ${{ steps.stats.outputs.total }}
          BRANCH: ${{ steps.stats.outputs.branch }}
          TS:     ${{ steps.stats.outputs.ts }}
          CSS:    ${{ steps.stats.outputs.css }}
          COMP:   ${{ steps.stats.outputs.comp }}
          PAGES:  ${{ steps.stats.outputs.pages }}
          VER:    ${{ steps.stats.outputs.ver }}
          ENG:    ${{ steps.stats.outputs.eng }}
        run: |
          REPO="rauell1/portfolio"
          cat > /tmp/readme_block.md << 'SENTINEL'
<!-- AUTO-UPDATED:START -->
SENTINEL

          # Append body (variables expand normally outside the heredoc)
          cat >> /tmp/readme_block.md << EOF
> ⚡ **This section is auto-generated by the [Auto README Updater](.github/workflows/auto-readme-updater.yml) on every push to \`main\`.**

## 📊 Repo Snapshot

| Field | Value |
|---|---|
| **Last commit** | \`${SHA}\` — ${MSG} |
| **Committed by** | ${AUTHOR} |
| **Commit date** | ${DATE} |
| **Branch** | \`${BRANCH}\` |
| **Total commits** | ${TOTAL} |
| **Package version** | \`${VER}\` |
| **Node engine** | \`${ENG}\` |
| **TypeScript files** | ${TS} |
| **CSS files** | ${CSS} |
| **React components** | ${COMP} |
| **Pages / views** | ${PAGES} |

## 🤖 Workflow Status

![README](https://github.com/${REPO}/actions/workflows/auto-readme-updater.yml/badge.svg)  ![Rollback](https://github.com/${REPO}/actions/workflows/safe-rollback.yml/badge.svg)
EOF

          # Append closing sentinel
          echo '<!-- AUTO-UPDATED:END -->' >> /tmp/readme_block.md

          echo "--- block preview ---"
          cat /tmp/readme_block.md

      - name: Splice block into README.md
        run: |
          set -euo pipefail
          README="README.md"

          # If sentinels missing, append the whole block
          if ! grep -q '<!-- AUTO-UPDATED:START -->' "$README"; then
            echo "" >> "$README"
            echo "---" >> "$README"
            echo "" >> "$README"
            cat /tmp/readme_block.md >> "$README"
            echo "Sentinels not found — block appended."
            exit 0
          fi

          # Use awk to replace everything between (and including) the sentinel lines
          awk '
            /<!-- AUTO-UPDATED:START -->/ { printing=1; system("cat /tmp/readme_block.md"); next }
            /<!-- AUTO-UPDATED:END -->/   { printing=0; next }
            !printing                     { print }
          ' "$README" > /tmp/readme_new.md

          mv /tmp/readme_new.md "$README"
          echo "Sentinel block replaced via awk."

      - name: Commit updated README
        run: |
          git diff --quiet README.md && {
            echo "README unchanged — nothing to commit."
            exit 0
          }
          git add README.md
          git commit -m "docs(auto): update README snapshot [skip ci]"
          # Pull with rebase in case another commit landed while we ran
          git pull --rebase origin main
          git push origin main
          echo "✅ README updated and pushed."
