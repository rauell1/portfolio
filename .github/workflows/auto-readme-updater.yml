# ============================================================
# AUTO README UPDATER
# Triggers on every push to main. Reads the repo structure,
# package.json scripts, and last-commit metadata, then rewrites
# the dynamic sections of README.md between the sentinel comments
# <!-- AUTO-UPDATED:START --> and <!-- AUTO-UPDATED:END -->.
# All existing hand-written content outside those sentinels is
# preserved. The bot commits directly to main only when the file
# actually changed, so it never creates noise commits.
# ============================================================
name: Auto README Updater

on:
  push:
    branches:
      - main
    # Ignore self-commits from the bot to prevent infinite loops
    paths-ignore:
      - 'README.md'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Regenerate dynamic README sections
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout with full history so we can read commit metadata ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set git identity for the auto-commit ──
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ── 3. Build the dynamic block and splice it into README.md ──
      - name: Update README dynamic section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ── Gather data ──────────────────────────────────────────────
          LAST_COMMIT_SHA=$(git rev-parse --short HEAD)
          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          LAST_COMMIT_DATE=$(git log -1 --pretty=format:"%cd" --date=format:"%Y-%m-%d %H:%M UTC")
          LAST_COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # Count source files
          TS_FILES=$(find src -name "*.ts" -o -name "*.tsx" 2>/dev/null | wc -l | tr -d ' ')
          CSS_FILES=$(find src -name "*.css" 2>/dev/null | wc -l | tr -d ' ')
          COMPONENT_COUNT=$(find src/components -name "*.tsx" 2>/dev/null | wc -l | tr -d ' ')
          PAGE_COUNT=$(find src/pages src/views src/app -name "*.tsx" 2>/dev/null | wc -l | tr -d ' ')

          # Workflow badges
          REPO="rauell1/portfolio"
          README_BADGE="![README](https://github.com/${REPO}/actions/workflows/auto-readme-updater.yml/badge.svg)"
          ROLLBACK_BADGE="![Rollback](https://github.com/${REPO}/actions/workflows/safe-rollback.yml/badge.svg)"

          # Package version
          PKG_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "n/a")
          NODE_ENGINE=$(node -p "require('./package.json').engines?.node || 'n/a'" 2>/dev/null || echo "n/a")

          # ── Build the replacement block ──────────────────────────────
          BLOCK=$(cat <<MDBLOCK
<!-- AUTO-UPDATED:START -->
> ⚡ **This section is auto-generated by the [Auto README Updater](.github/workflows/auto-readme-updater.yml) on every push to \`main\`.**

## 📊 Repo Snapshot

| Field | Value |
|---|---|
| **Last commit** | \`${LAST_COMMIT_SHA}\` — ${LAST_COMMIT_MSG} |
| **Committed by** | ${LAST_COMMIT_AUTHOR} |
| **Commit date** | ${LAST_COMMIT_DATE} |
| **Branch** | \`${BRANCH}\` |
| **Total commits** | ${TOTAL_COMMITS} |
| **Package version** | \`${PKG_VERSION}\` |
| **Node engine** | \`${NODE_ENGINE}\` |
| **TypeScript files** | ${TS_FILES} |
| **CSS files** | ${CSS_FILES} |
| **React components** | ${COMPONENT_COUNT} |
| **Pages / views** | ${PAGE_COUNT} |

## 🤖 Workflow Status

${README_BADGE}  ${ROLLBACK_BADGE}
<!-- AUTO-UPDATED:END -->
MDBLOCK
          )

          README_FILE="README.md"

          # ── If sentinels don't exist yet, append the block ───────────
          if ! grep -q '<!-- AUTO-UPDATED:START -->' "${README_FILE}"; then
            echo "" >> "${README_FILE}"
            echo "---" >> "${README_FILE}"
            echo "" >> "${README_FILE}"
            printf '%s\n' "${BLOCK}" >> "${README_FILE}"
            echo "Sentinels not found — appended block."
          else
            # Replace everything between the sentinel comments (inclusive)
            python3 - <<PYEOF
import re, pathlib
readme = pathlib.Path('${README_FILE}').read_text()
block  = '''${BLOCK}'''
pattern = r'<!-- AUTO-UPDATED:START -->.*?<!-- AUTO-UPDATED:END -->'
replaced, n = re.subn(pattern, block, readme, flags=re.DOTALL)
if n == 0:
    raise SystemExit('Sentinel pattern not matched — aborting.')
pathlib.Path('${README_FILE}').write_text(replaced)
print(f'Replaced {n} sentinel block(s).')
PYEOF
          fi

      # ── 4. Commit only if something changed ──
      - name: Commit updated README
        run: |
          git diff --quiet README.md && {
            echo "README unchanged — nothing to commit."
            exit 0
          }
          git add README.md
          git commit -m "docs(auto): update README snapshot [skip ci]"
          git push origin main
          echo "README updated and pushed."
