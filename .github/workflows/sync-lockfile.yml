# =============================================================
# SYNC LOCK FILE
# Runs automatically whenever package.json changes on main,
# or can be triggered manually.
#
# Purpose: keeps package-lock.json in sync with package.json
# so that `npm ci` never fails in other workflows with
# EUSAGE / lock file out of sync errors.
#
# How it works:
#   1. Checks out main
#   2. Runs `npm install` (which regenerates package-lock.json)
#   3. If the lock file changed, commits and pushes it with [skip ci]
#      so it does NOT re-trigger safe-rollback or workflow-guard
#      (those workflows ignore README.md and lock file changes)
#
# ── DEPENDENCY ADVISORY ──────────────────────────────────────────────────
# This workflow only needs actions/checkout and actions/setup-node.
# Review node-version here whenever you update the node-version in
# safe-rollback.yml or workflow-guard.yml — all three should match.
# =============================================================
name: Sync Lock File

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: sync-lockfile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Regenerate lock file
        run: npm install --package-lock-only

      - name: Commit if changed
        run: |
          git diff --quiet package-lock.json && { echo "Lock file already in sync."; exit 0; }
          git add package-lock.json
          git commit -m "chore(deps): regenerate package-lock.json [skip ci]"
          git pull --rebase origin main
          git push origin main
          echo "Lock file updated and pushed."
