# ============================================================
# WORKFLOW GUARD
# Runs on every push to main and on every PR.
#
# Two independent jobs — no lint dependency:
#
#  1. build-check          — npm ci + vite build must pass
#  2. dry-run-readme-shell — safe find/node dry-run against src/
# ============================================================
name: Workflow Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  build-check:
    name: Vite build sanity check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          CI: true

  dry-run-readme-shell:
    name: Dry-run README shell logic against real src/ tree
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Simulate README stat gathering
        run: |
          set -euo pipefail

          echo "=== Verifying src/ directory structure ==="
          ls -la src/

          echo ""
          echo "=== Running safe find commands (must not exit 1) ==="

          TS=$(find src \( -name '*.ts' -o -name '*.tsx' \) 2>/dev/null | wc -l | tr -d ' ' || echo '0')
          CSS=$(find src -name '*.css' 2>/dev/null | wc -l | tr -d ' ' || echo '0')

          if [ -d src/components ]; then
            COMP=$(find src/components -name '*.tsx' 2>/dev/null | wc -l | tr -d ' ' || echo '0')
          else
            COMP=0
          fi

          PAGES=0
          for dir in src/pages src/views src/app; do
            if [ -d "$dir" ]; then
              COUNT=$(find "$dir" -name '*.tsx' 2>/dev/null | wc -l | tr -d ' ' || echo '0')
              PAGES=$((PAGES + COUNT))
            fi
          done

          VER=$(node -p "require('./package.json').version" 2>/dev/null || echo 'n/a')

          echo ""
          echo "=== Results ==="
          echo "TS files    : $TS"
          echo "CSS files   : $CSS"
          echo "Components  : $COMP"
          echo "Pages/views : $PAGES"
          echo "Version     : $VER"
          echo ""
          echo "All find commands completed without error. Dry-run passed."
