# =============================================================
# UPDATE CODEBASE MAP
# Runs on every push to main (except changes to the map itself),
# or can be triggered manually.
#
# Purpose: regenerates CODEBASE_MAP.md so it always reflects the
# current state of the repository tree.
#
# ── DEPENDENCY ADVISORY ──────────────────────────────────────────────────
# This workflow uses the following pinned GitHub Actions:
#   - actions/checkout@v4
#   - actions/setup-node@v6  (node-version: '24')
#
# Review and update these pins whenever you update the node-version
# in safe-rollback.yml or workflow-guard.yml — all three must match.
# =============================================================
name: Update Codebase Map

on:
  push:
    branches:
      - main
    # Only run when source files actually change — skip if only CODEBASE_MAP.md changed
    paths-ignore:
      - 'CODEBASE_MAP.md'
      - '.github/workflows/update-codebase-map.yml'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# One run at a time per branch — never cancel a running map update.
concurrency:
  group: update-codebase-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-map:
    name: Regenerate CODEBASE_MAP.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate CODEBASE_MAP.md
        run: node .github/scripts/generate-codebase-map.mjs

      - name: Commit updated map (if changed)
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CODEBASE_MAP.md
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to CODEBASE_MAP.md — skipping commit."
            echo "## CODEBASE_MAP.md already up to date" >> $GITHUB_STEP_SUMMARY
          else
            COMMIT_SHA=$(git rev-parse --short HEAD)
            git commit -m "docs: auto-update CODEBASE_MAP.md [${COMMIT_SHA}] [skip ci]"
            git pull --rebase origin main
            git push
            echo "## CODEBASE_MAP.md updated" >> $GITHUB_STEP_SUMMARY
            echo "Map regenerated for commit \`${COMMIT_SHA}\`" >> $GITHUB_STEP_SUMMARY
          fi
