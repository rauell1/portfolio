<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" width="100%" height="100%">
  <rect width="1200" height="630" fill="#0c0a09" /> <!-- Dark stone background -->
  
  <defs>
    <!-- Modern emerald to clean-tech blue gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c1917" stroke-width="1" />
    </pattern>
    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <!-- Subtle gradient glow in center -->
  <circle cx="600" cy="315" r="250" fill="url(#logoGrad)" opacity="0.08" filter="url(#glow)" />

  <!-- Premium Brand Badge Container -->
  <rect x="520" y="235" width="160" height="160" rx="40" fill="url(#logoGrad)" filter="url(#glow)" />
  
  <!-- Stylized Initials "RO" -->
  <text x="600" y="347" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="80" fill="#ffffff" text-anchor="middle" letter-spacing="-3">RO</text>
  
</svg>